<div *ngIf="!noticia" class="max-w-4xl mx-auto px-4 py-12 text-center">
  <p class="text-gray-600 mb-4">No se ha seleccionado ninguna noticia.</p>
  <button
    (click)="volver.emit()"
    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm"
  >
    Volver al listado de noticias
  </button>
</div>

<div *ngIf="noticia" class="max-w-4xl mx-auto px-4 pb-12 space-y-6">
  <div class="flex items-center justify-between border-b pb-3">
    <div class="flex items-center gap-2">
      <button
        (click)="volver.emit()"
        class="text-blue-600 hover:text-blue-800 text-sm font-medium flex items-center gap-1"
      >
        &larr; Volver al catálogo
      </button>
      <span class="text-gray-400">/</span>
      <span class="text-xs bg-blue-100 text-blue-800 font-semibold px-2.5 py-1 rounded">
        {{ noticia.categoria }}
      </span>
    </div>
    <span class="text-xs text-gray-500">Publicado: {{ noticia.fecha }}</span>
  </div>

  <div class="bg-white border border-gray-300 rounded-lg overflow-hidden shadow-sm">
    <div class="w-full h-72 sm:h-96 bg-gray-200 overflow-hidden relative">
      <img
        [src]="noticia.imagen"
        [alt]="noticia.titulo"
        (error)="onImageError($event)"
        class="w-full h-full object-cover"
      />
    </div>

    <div class="p-6 sm:p-8 space-y-6">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 leading-tight">
        {{ noticia.titulo }}
      </h1>

      <div class="bg-gray-50 border-l-4 border-blue-600 p-4 rounded-r text-gray-700 font-medium text-base">
        {{ noticia.descripcion }}
      </div>

      <div class="border border-gray-200 rounded p-6 bg-white space-y-4">
        <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400">
          Información completa de la noticia (texto extendido)
        </h2>
        <p class="text-gray-700 leading-relaxed text-base sm:text-lg whitespace-pre-line">
          {{ noticia.contenido }}
        </p>
      </div>

      <div class="pt-4 border-t border-gray-200 flex flex-wrap items-center gap-4">
        <button
          (click)="onToggleFavorito()"
          [class.bg-yellow-400]="esFavorito"
          [class.hover:bg-yellow-500]="esFavorito"
          [class.text-yellow-950]="esFavorito"
          [class.bg-blue-600]="!esFavorito"
          [class.hover:bg-blue-700]="!esFavorito"
          [class.text-white]="!esFavorito"
          class="px-5 py-2.5 rounded font-semibold text-sm transition-colors flex items-center gap-2 shadow"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            [attr.fill]="esFavorito ? 'currentColor' : 'none'"
            stroke="currentColor"
            strokeWidth="2"
            class="w-5 h-5"
          >
            <path
              strokeLinecap="round"
              strokeLinejoin="round"
              d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"
            />
          </svg>
          <span>{{ esFavorito ? 'Quitar de favoritos' : 'Agregar a favoritos' }}</span>
        </button>

        <button
          (click)="navegar('contacto')"
          class="bg-gray-100 hover:bg-gray-200 text-gray-800 border border-gray-300 font-semibold px-5 py-2.5 rounded text-sm transition-colors"
        >
          Contacto
        </button>

        <button
          (click)="volver.emit()"
          class="ml-auto text-sm text-gray-600 hover:text-gray-900 underline"
        >
          Volver al listado
        </button>
      </div>
    </div>
  </div>
</div>
